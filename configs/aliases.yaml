# PrivacyFilter — 가명(alias) 풀 정의
#
# 마스킹 시 [PERSON] 같은 placeholder 대신 자연스러운 가명을 사용해
# LLM 응답 품질을 보존한다. 응답 후 alias → original 로 복원.
#
# 같은 세션에서 같은 entity 는 같은 alias 를 받도록 AliasManager 가 관리.

# === PERSON ===
# 가상의 한국 일반 이름 (성씨·성별 mix)
