  - 프로젝트 B
  - 차세대 시스템 개발
  - 신규 플랫폼 구축
  - 디지털 혁신 사업
  - 통합 관리 시스템
  - 데이터 분석 플랫폼
  - 클라우드 전환 사업
  - 업무 자동화 추진단
  - 신사업 발굴 TF
  - 인프라 고도화 프로젝트
  - 운영 효율화 사업
  - 차세대 인프라 구축
  - 통합 솔루션 개발
  - 신기술 도입 사업

# === 정규식 토큰 더미 값 ===
# entity 자체는 마스킹하되 LLM 이 자연스럽게 처리할 더미 값.
# 같은 종류의 entity 가 여러 개 등장하면 순번을 붙여 구분
# (예: PHONE 1: 010-0000-0001, PHONE 2: 010-0000-0002, ...)
regex_dummies:
  PHONE: "010-0000-{i:04d}"
  EMAIL: "user{i}@example.com"
  RRN: "900101-1000{i:03d}"
  CARD: "0000-0000-0000-{i:04d}"
  ACCOUNT: "000-0000-{i:06d}"
  IP: "10.0.0.{i}"
  API_KEY: "sk-dummy-{i:032d}"
  PASSPORT: "M{i:08d}"
  DRIVER_LICENSE: "00-00-000000-{i:02d}"
  BIZ_NUM: "000-00-{i:05d}"
