<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; font-family: -apple-system, "Malgun Gothic", sans-serif; color: #1a1a1a; }
    header { background: #10a37f; color: #fff; padding: 12px 16px; font-weight: 700; font-size: 15px; }
    .body { padding: 14px 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .label { font-size: 14px; }
    .status { font-size: 12px; color: #666; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; background:#bbb; }
    .dot.on { background:#10a37f; }
    /* 토글 스위치 */
    .switch { position: relative; width: 42px; height: 24px; }
    .switch input { display: none; }
    .slider { position:absolute; inset:0; background:#ccc; border-radius:24px; transition:.2s; cursor:pointer; }
    .slider:before { content:""; position:absolute; height:18px; width:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
    input:checked + .slider { background:#10a37f; }
    input:checked + .slider:before { transform: translateX(18px); }
    button { width:100%; padding:8px; border:1px solid #ddd; background:#f7f7f7; border-radius:6px; cursor:pointer; font-size:13px; }
    button:hover { background:#efefef; }
    .hint { font-size: 11px; color:#999; margin-top:10px; line-height:1.5; }
  </style>
</head>
<body>
  <header>🔒 PrivacyFilter</header>
  <div class="body">
    <div class="row">
      <span class="label">마스킹 활성화</span>
      <label class="switch">
        <input type="checkbox" id="toggle" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="label">디버그 로그 <span style="color:#999;font-size:11px">(F12 콘솔)</span></span>
      <label class="switch">
        <input type="checkbox" id="debugToggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="status"><span class="dot" id="dot"></span><span id="modelStatus">모델 확인 중…</span></span>
    </div>
    <div class="row">
      <span class="status" id="stats">매핑 0개</span>
    </div>
    <button id="clearBtn">이 탭 세션 매핑 초기화</button>
    <div class="hint">전송 전 민감정보를 로컬에서 자동 마스킹하고, 응답은 원래대로 복원합니다. 외부 전송 없음.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
